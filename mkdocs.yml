site_name: Project Līlāvatī
site_description: Finance calculations AI agents can check - deterministic, reference-tested engines served as MCP tools, with an open benchmark (alpha)
site_author: Project Līlāvatī Contributors
site_url: https://revendrat.github.io/lilavati/
repo_url: https://github.com/revendrat/lilavati
repo_name: revendrat/lilavati

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  # polyfill.io was removed: the domain served malicious code after a 2024 ownership change.
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

