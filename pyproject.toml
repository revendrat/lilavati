[project]
name = "lilavati"
version = "0.1.0"
description = "An open-source, neuro-symbolic agentic operating system and evaluation benchmark for quantitative finance, credit, and capital markets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Project Lilavati Contributors" }
]
keywords = [
    "finance",
    "agents",
    "mcp",
    "quantitative-finance",
    "econometrics",
    "financial-ml",
    "three-statement-modeling",
    "fixed-income",
    "credit-risk",
    "algorithmic-trading",
    "z3-solver"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "statsmodels>=0.14.0",
    "arch>=7.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.5.0",
    "cvxpy>=1.5.0",
    "z3-solver>=4.13.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
quantlib = [
    "QuantLib>=1.35",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
all = [
    "lilavati[quantlib,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/revendrat/lilavati"
Documentation = "https://github.com/revendrat/lilavati#readme"
Repository = "https://github.com/revendrat/lilavati.git"
Issues = "https://github.com/revendrat/lilavati/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lilavati"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "z3.*",
    "statsmodels.*",
    "arch.*",
    "QuantLib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

